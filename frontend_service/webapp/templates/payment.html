{% extends 'base.html' %}

{% block title %}Thanh toán - Fruit Shop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-lg">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="display-4 text-primary mb-3">
                        <i class="bi bi-credit-card-fill"></i>
                    </div>
                    <h2 class="fw-bold">Thanh toán đơn hàng</h2>
                    <p class="text-muted">Mã giao dịch: #PAY-{{ payment_id }}</p>
                </div>

                <div class="alert alert-info border-0 bg-light-blue mb-4">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-info-circle-fill fs-4 me-3 text-primary"></i>
                        <div>
                            Vui lòng nhấn nút "Thanh toán ngay" để hoàn tất đơn hàng của bạn.
                        </div>
                    </div>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill py-3 fw-bold">
                            <i class="bi bi-shield-check me-2"></i>Thanh toán ngay
                        </button>
                        <a href="{% url 'product_list' %}" class="btn btn-link text-muted">Hủy giao dịch</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-light-blue { background-color: #f0f7ff; }
    .btn-primary {
        background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
        border: none;
        box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(13, 110, 253, 0.4);
    }
</style>
{% endblock %}
