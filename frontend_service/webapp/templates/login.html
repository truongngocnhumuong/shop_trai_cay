{% extends 'base.html' %}

{% block title %}Đăng nhập - Fruit Shop{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-apple fruit-icon"></i>
            <h2 class="mt-3">Đăng nhập</h2>
            <p class="text-muted">Fruit Shop - Cửa hàng trái cây tươi ngon</p>
        </div>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">
                    <i class="bi bi-person"></i> Tên đăng nhập
                </label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">
                    <i class="bi bi-lock"></i> Mật khẩu
                </label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
            </button>
        </form>

        <div class="mt-4 text-center">
            <small class="text-muted">
                Chưa có tài khoản? Vui lòng đăng ký tại Auth Service (Port 8001)
            </small>
        </div>
    </div>
</div>
{% endblock %}
