{% extends 'base.html' %}

{% block title %}Thanh toán thành công - Fruit Shop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-lg text-center overflow-hidden">
            <div class="bg-success py-4">
                <div class="display-1 text-white animate__animated animate__bounceIn">
                    <i class="bi bi-check-circle-fill"></i>
                </div>
            </div>
            <div class="card-body p-5">
                <h2 class="fw-bold text-success mb-2">Thanh toán hoàn tất!</h2>
                <p class="text-muted mb-4 subtitle">Đơn hàng của bạn đã được xác nhận và đang được xử lý.</p>

                <div class="transaction-details p-4 bg-light rounded-3 mb-4 text-start">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Mã giao dịch:</span>
                        <span class="fw-bold">{{ data.transaction_id }}</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="text-muted">Trạng thái:</span>
                        <span class="badge bg-success-soft text-success px-3 rounded-pill">Đã thanh toán</span>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <a href="{% url 'product_list' %}" class="btn btn-primary btn-lg rounded-pill py-3 fw-bold">
                        Quay lại trang chủ
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-success-soft {
        background-color: #e6f9ed;
    }

    .animate__animated {
        animation-duration: 0.8s;
    }

    .btn-primary {
        background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
        border: none;
        box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
    }
</style>
{% endblock %}
