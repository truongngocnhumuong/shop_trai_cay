{% extends 'base.html' %}

{% block title %}Cập nhật kho - Inventory Service{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <div class="card">
        <h1 class="title" style="margin-bottom: 2rem; text-align: center;">🔄 Cập nhật tồn kho</h1>

        <form method="post" action="{% url 'web_inventory_update' %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Product ID</label>
                <input type="text" value="{{ product_id }}" class="form-input" disabled style="opacity: 0.7;">
                <input type="hidden" name="product_id" value="{{ product_id }}">
            </div>

            <div class="form-group">
                <label for="quantity" class="form-label">Số lượng mới</label>
                <input type="number" id="quantity" name="quantity" class="form-input" value="{{ current_quantity }}"
                    min="0" required autofocus>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <a href="{% url 'inventory_dashboard' %}" class="btn" style="flex: 1; border: 1px solid #fff;">Hủy</a>
                <button type="submit" class="btn btn-primary" style="flex: 2;">Lưu thay đổi</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
