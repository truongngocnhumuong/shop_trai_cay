<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán an toàn | PayService</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .checkout-container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
        }

        .order-summary {
            flex: 1;
            background: #1e1b4b;
            color: white;
            padding: 3rem;
            display: flex;
            flex-direction: column;
        }

        .payment-form {
            flex: 1.2;
            padding: 3rem;
            background: white;
        }

        .brand-pill {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 16px;
            border-radius: 100px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        .price-tag {
            font-size: 3rem;
            font-weight: 700;
            margin: 1rem 0;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px;
            transition: 0.2s;
        }

        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .btn-pay {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            width: 100%;
            border: none;
            padding: 1rem;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-top: 1rem;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2);
            transition: 0.3s;
        }

        .btn-pay:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(79, 70, 229, 0.3);
        }

        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 0.8rem;
            margin-top: 1.5rem;
        }

        @media (max-width: 768px) {
            .checkout-container {
                flex-direction: column;
            }

            .order-summary {
                padding: 2rem;
            }

            .payment-form {
                padding: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="checkout-container">
        <div class="order-summary">
            <div class="brand-pill">
                <i class="bi bi-shield-lock-fill"></i>
                Cổng thanh toán an toàn PayService
            </div>
            <p class="text-white-50 mb-1">Thanh toán cho Đơn hàng #{{ payment.order_id }}</p>
            <h1 class="price-tag">{{ payment.amount }} VNĐ</h1>

            <div class="mt-auto">
                <div class="d-flex justify-content-between text-white-50 mb-2">
                    <span>Tạm tính</span>
                    <span>{{ payment.amount }} VNĐ</span>
                </div>
                <div class="d-flex justify-content-between text-white-50 mb-2">
                    <span>Phí xử lý</span>
                    <span>0 VNĐ</span>
                </div>
                <hr class="opacity-20 my-3">
                <div class="d-flex justify-content-between fw-bold fs-5">
                    <span>Tổng cộng</span>
                    <span>{{ payment.amount }} VNĐ</span>
                </div>
            </div>
        </div>

        <div class="payment-form">
            <h4 class="fw-bold mb-4">Chi tiết thanh toán</h4>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label">Tên chủ thẻ</label>
                    <input type="text" class="form-control" value="Người dùng Demo" readonly>
                </div>

                <div class="mb-4">
                    <label class="form-label">Số thẻ</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 rounded-start-3"><i
                                class="bi bi-credit-card"></i></span>
                        <input type="text" class="form-control border-start-0" value="**** **** **** 4242" readonly>
                    </div>
                </div>

                <div class="row mb-5">
                    <div class="col-6">
                        <label class="form-label">Ngày hết hạn</label>
                        <input type="text" class="form-control" value="12/26" readonly>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Mã CVC / CVV</label>
                        <input type="text" class="form-control" value="***" readonly>
                    </div>
                </div>

                <button type="submit" class="btn-pay">
                    Thanh toán ngay · {{ payment.amount }} VNĐ
                </button>

                <div class="secure-badge">
                    <i class="bi bi-lock-fill"></i>
                    Đã mã hóa SSL & Bảo mật AES-256 Bit
                </div>
            </form>

            <div class="text-center mt-4">
                <a href="#" class="text-decoration-none text-muted small" onclick="window.history.back()">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại cửa hàng
                </a>
            </div>
        </div>
    </div>
</body>

</html>
