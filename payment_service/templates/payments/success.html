<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán thành công | PayService</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .success-card {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            text-align: center;
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: #dcfce7;
            color: #166534;
            border-radius: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 2rem;
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .btn-return {
            background: #1e1b4b;
            color: white;
            width: 100%;
            border: none;
            padding: 1rem;
            border-radius: 14px;
            font-weight: 700;
            margin-top: 2rem;
            text-decoration: none;
            display: block;
            transition: 0.3s;
        }

        .btn-return:hover {
            background: #312e81;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="success-card">
        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>
        <h2 class="fw-bold mb-2">Thanh toán thành công!</h2>
        <p class="text-muted mb-4">Giao dịch của bạn đã được xử lý an toàn.</p>

        <div class="bg-light p-4 rounded-3 text-start mb-4">
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted font-monospace small">MÃ GIAO DỊCH</span>
                <span class="fw-bold font-monospace small">{{ payment.transaction_id }}</span>
            </div>
            <div class="d-flex justify-content-between">
                <span class="text-muted font-monospace small">SỐ TIỀN ĐÃ TRẢ</span>
                <span class="fw-bold font-monospace small">{{ payment.amount }} VNĐ</span>
            </div>
        </div>

        <p class="small text-muted mb-4">Bạn sẽ được tự động chuyển về cửa hàng sau <span id="countdown">5</span>
            giây...</p>

        <a href="http://localhost:8000" class="btn-return">
            Quay lại Cửa hàng trái cây
        </a>
    </div>

    <script>
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = "http://localhost:8000";
            }
        }, 1000);
    </script>
</body>

</html>
